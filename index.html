<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ethanol</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --accent: #00d4aa;
      --text: #e8eaed;
      --muted: #8b909a;
      --danger: #ff5a5a;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
      padding-top: env(safe-area-inset-top);
    }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    .gauge-wrap {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 10px 0 20px;
    }
    canvas { width: 100%; height: 100%; }
    .gauge-value {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .gauge-value .pct { font-size: 48px; font-weight: 700; color: var(--accent); }
    .gauge-value .unit { font-size: 16px; color: var(--muted); }
    .temp-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px 24px;
      margin: 12px 0;
      font-size: 22px;
      font-weight: 600;
      min-width: 180px;
      text-align: center;
    }
    button {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 30px;
      padding: 14px 32px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      margin: 8px 0;
      transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: #2a2e38; color: var(--text); }
    .status { color: var(--muted); font-size: 14px; margin: 8px 0 16px; min-height: 20px; }
    .section {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 24px;
    }
    .section h2 { font-size: 18px; margin-bottom: 12px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
    input {
      width: 100%;
      background: #12141a;
      border: 1px solid #2a2e38;
      border-radius: 10px;
      padding: 12px;
      color: var(--text);
      font-size: 16px;
    }
    .result { margin-top: 16px; font-size: 15px; line-height: 1.5; }
    .result strong { color: var(--accent); }
    .toggle { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; }
    .ios-note {
      background: #1e222b;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--muted);
      margin-top: 20px;
      max-width: 420px;
      text-align: center;
    }
    .ios-note a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <h1>Ethanol</h1>
  <p class="subtitle">Fuel sensor & blend calculator</p>

  <div class="gauge-wrap">
    <canvas id="gauge" width="220" height="220"></canvas>
    <div class="gauge-value">
      <div class="pct" id="ethanolPct">--</div>
      <div class="unit">%</div>
    </div>
  </div>

  <div class="temp-card" id="tempDisplay">-- °F</div>

  <button id="connectBtn">Connect to Sensor</button>
  <div class="status" id="status">Not connected</div>
  <button class="secondary" id="unitToggle">°F / °C</button>

  <div class="section">
    <h2>Blend Calculator</h2>
    <label>Tank capacity</label>
    <input type="number" id="tankCap" value="16.9" step="0.1">
    <div class="toggle">
      <input type="checkbox" id="useLiters">
      <label for="useLiters" style="margin:0">Use liters</label>
    </div>
    <label>Current fuel level (%)</label>
    <input type="number" id="fuelLevel" value="50" step="1">
    <label>Current ethanol (%)</label>
    <input type="number" id="currentE" value="10" step="0.1">
    <label>Desired ethanol (%)</label>
    <input type="number" id="desiredE" value="40" step="0.1">
    <label>Pump gas ethanol (%)</label>
    <input type="number" id="gasE" value="10" step="0.1">
    <label>E85 ethanol (%)</label>
    <input type="number" id="e85E" value="85" step="0.1">
    <div class="result" id="calcResult">Enter values and connect or edit to calculate.</div>
  </div>

  <div class="ios-note">
    On iPhone Safari, install the free <a href="https://apps.apple.com/app/beacio/id6761301368" target="_blank">beacio</a> extension to enable Bluetooth.<br>
    Then enable it for this site.
  </div>

  <script>
    const SERVICE_UUID = 'ffe0';
    const CHAR_UUID = 'ffe1';

    let device, server, characteristic;
    let freedomUnits = true;
    let currentEthanol = null;
    let lastTempF = null, lastTempC = null;

    const connectBtn = document.getElementById('connectBtn');
    const statusEl = document.getElementById('status');
    const ethanolPct = document.getElementById('ethanolPct');
    const tempDisplay = document.getElementById('tempDisplay');
    const unitToggle = document.getElementById('unitToggle');
    const canvas = document.getElementById('gauge');
    const ctx = canvas.getContext('2d');

    function drawGauge(pct) {
      const c = canvas.width / 2;
      const r = 90;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // track
      ctx.beginPath();
      ctx.arc(c, c, r, 0.75 * Math.PI, 2.25 * Math.PI);
      ctx.strokeStyle = '#2a2e38';
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.stroke();
      // value
      if (pct != null) {
        const end = 0.75 * Math.PI + (1.5 * Math.PI * (pct / 100));
        ctx.beginPath();
        ctx.arc(c, c, r, 0.75 * Math.PI, end);
        ctx.strokeStyle = '#00d4aa';
        ctx.lineWidth = 14;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
    }
    drawGauge(null);

    function updateUI(eth, tempF, tempC) {
      currentEthanol = eth;
      lastTempF = tempF;
      lastTempC = tempC;
      ethanolPct.textContent = eth != null ? eth : '--';
      drawGauge(eth);
      const temp = freedomUnits ? tempF : tempC;
      const unit = freedomUnits ? '°F' : '°C';
      tempDisplay.textContent = temp != null ? `${temp} ${unit}` : `-- ${unit}`;
      document.getElementById('currentE').value = eth ?? 10;
      calculate();
    }

    unitToggle.addEventListener('click', () => {
      freedomUnits = !freedomUnits;
      if (lastTempF != null) {
        updateUI(currentEthanol, lastTempF, lastTempC);
      } else {
        tempDisplay.textContent = freedomUnits ? '-- °F' : '-- °C';
      }
    });

    async function connect() {
      if (!navigator.bluetooth) {
        statusEl.textContent = 'Web Bluetooth not available. On iPhone, install beacio extension.';
        return;
      }
      try {
        statusEl.textContent = 'Requesting device...';
        device = await navigator.bluetooth.requestDevice({
          filters: [
            { name: 'Ethanol' },
            { name: 'EthanolSensor' },
            { name: 'Ethanol Sensor' },
            { services: [SERVICE_UUID] }
          ],
          optionalServices: [SERVICE_UUID]
        });
        statusEl.textContent = 'Connecting...';
        server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        characteristic = await service.getCharacteristic(CHAR_UUID);
        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', onData);
        device.addEventListener('gattserverdisconnected', onDisconnect);
        connectBtn.disabled = true;
        connectBtn.textContent = 'Connected';
        statusEl.textContent = 'Connected';
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Failed: ' + (err.message || 'Unknown error');
      }
    }

    function onData(event) {
      const value = event.target.value;
      const decoder = new TextDecoder('utf-8');
      const text = decoder.decode(value).trim();
      const parts = text.split(',');
      if (parts.length >= 3) {
        const eth = parseInt(parts[0], 10);
        const f = parseInt(parts[1], 10);
        const c = parseInt(parts[2], 10);
        updateUI(eth, f, c);
      }
    }

    function onDisconnect() {
      connectBtn.disabled = false;
      connectBtn.textContent = 'Connect to Sensor';
      statusEl.textContent = 'Disconnected';
      updateUI(null, null, null);
    }

    connectBtn.addEventListener('click', connect);

    // Calculator
    function calculate() {
      let tank = parseFloat(document.getElementById('tankCap').value) || 16.9;
      const useLiters = document.getElementById('useLiters').checked;
      if (useLiters) tank = tank / 3.78541;
      const levelPct = parseFloat(document.getElementById('fuelLevel').value) || 50;
      const current = parseFloat(document.getElementById('currentE').value) || 10;
      const desired = parseFloat(document.getElementById('desiredE').value) || 40;
      const gasE = parseFloat(document.getElementById('gasE').value) || 10;
      const e85E = parseFloat(document.getElementById('e85E').value) || 85;

      let level = tank * (levelPct / 100);
      let addE85 = 0;
      let mix = current;
      const step = 0.001;
      while (tank - level > 0.001) {
        const add = mix < desired ? e85E : gasE;
        if (mix < desired) addE85 += step;
        level += step;
        mix = (level * mix + step * add) / (level + step);
      }
      let addGas = Math.max(0, tank - (tank * levelPct / 100) - addE85);
      if (useLiters) {
        addE85 *= 3.78541;
        addGas *= 3.78541;
      }
      const unit = useLiters ? 'liters' : 'gallons';
      document.getElementById('calcResult').innerHTML =
        `<strong>Add ${addE85.toFixed(1)} ${unit} of E85</strong><br>` +
        `<strong>Add ${addGas.toFixed(1)} ${unit} of gas</strong><br>` +
        `Resulting mix: ${mix.toFixed(0)}% ethanol`;
    }

    ['tankCap','fuelLevel','currentE','desiredE','gasE','e85E'].forEach(id => {
      document.getElementById(id).addEventListener('input', calculate);
    });
    document.getElementById('useLiters').addEventListener('change', calculate);
    calculate();
  </script>
</body>
</html>
