<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ethanol</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #0b0d11;
      --card: #161920;
      --accent: #00d4aa;
      --text: #f0f2f5;
      --muted: #8a919d;
      --border: #252a33;
      --radius: 18px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.3px; }
    .tabs {
      display: flex;
      background: var(--card);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 20px;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active {
      background: var(--accent);
      color: #000;
    }
    .panel { display: none; max-width: 420px; margin: 0 auto; }
    .panel.active { display: block; }

    /* Readout */
    .gauge-wrap {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 10px auto 24px;
    }
    canvas { width: 100%; height: 100%; }
    .gauge-value {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .gauge-value .pct { font-size: 56px; font-weight: 700; color: var(--accent); line-height: 1; }
    .gauge-value .unit { font-size: 18px; color: var(--muted); margin-top: 2px; }
    .temp-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      text-align: center;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    button {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 28px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #252a33; color: var(--text); }
    button:disabled { opacity: 0.55; }
    .status {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-top: 12px;
      min-height: 20px;
    }

    /* Calculator */
    .form {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin: 14px 0 6px;
    }
    label:first-child { margin-top: 0; }
    input[type="number"] {
      width: 100%;
      background: #0f1115;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      color: var(--text);
      font-size: 16px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }
    .row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
    .result {
      margin-top: 20px;
      background: #0f1115;
      border-radius: 12px;
      padding: 16px;
      font-size: 15px;
      line-height: 1.6;
    }
    .result strong { color: var(--accent); }
    .ios-note {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 28px;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }
    .ios-note a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <h1>Ethanol</h1>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="readout">Readout</div>
    <div class="tab" data-tab="calc">Calculator</div>
  </div>

  <!-- Readout panel -->
  <div id="readout" class="panel active">
    <div class="gauge-wrap">
      <canvas id="gauge" width="240" height="240"></canvas>
      <div class="gauge-value">
        <div class="pct" id="ethanolPct">--</div>
        <div class="unit">%</div>
      </div>
    </div>
    <div class="temp-card" id="tempDisplay">-- °F</div>
    <div class="controls">
      <button id="connectBtn">Connect</button>
      <button class="secondary" id="unitToggle">°F / °C</button>
    </div>
    <div class="status" id="status">Not connected</div>
  </div>

  <!-- Calculator panel -->
  <div id="calc" class="panel">
    <div class="form">
      <label>Tank capacity</label>
      <input type="number" id="tankCap" value="16.9" step="0.1">
      <div class="row">
        <input type="checkbox" id="useLiters">
        <label for="useLiters" style="margin:0">Use liters</label>
      </div>
      <label>Current fuel level (%)</label>
      <input type="number" id="fuelLevel" value="50" step="1">
      <label>Current ethanol (%)</label>
      <input type="number" id="currentE" value="10" step="0.1">
      <label>Desired ethanol (%)</label>
      <input type="number" id="desiredE" value="40" step="0.1">
      <label>Pump gas ethanol (%)</label>
      <input type="number" id="gasE" value="10" step="0.1">
      <label>E85 ethanol (%)</label>
      <input type="number" id="e85E" value="85" step="0.1">
      <div class="result" id="calcResult">Enter values to calculate.</div>
    </div>
  </div>

  <div class="ios-note">
    On iPhone, install free <a href="https://apps.apple.com/app/beacio/id6761301368" target="_blank">beacio</a> and enable it for Bluetooth.
  </div>

  <script>
    const SERVICE_UUID = 'ffe0';
    const CHAR_UUID = 'ffe1';

    let device, server, characteristic;
    let freedomUnits = true;
    let currentEthanol = null;
    let lastTempF = null, lastTempC = null;

    // Tabs
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');
      });
    });

    const connectBtn = document.getElementById('connectBtn');
    const statusEl = document.getElementById('status');
    const ethanolPct = document.getElementById('ethanolPct');
    const tempDisplay = document.getElementById('tempDisplay');
    const unitToggle = document.getElementById('unitToggle');
    const canvas = document.getElementById('gauge');
    const ctx = canvas.getContext('2d');

    function drawGauge(pct) {
      const c = canvas.width / 2;
      const r = 100;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.beginPath();
      ctx.arc(c, c, r, 0.75 * Math.PI, 2.25 * Math.PI);
      ctx.strokeStyle = '#252a33';
      ctx.lineWidth = 16;
      ctx.lineCap = 'round';
      ctx.stroke();
      if (pct != null) {
        const end = 0.75 * Math.PI + (1.5 * Math.PI * (pct / 100));
        ctx.beginPath();
        ctx.arc(c, c, r, 0.75 * Math.PI, end);
        ctx.strokeStyle = '#00d4aa';
        ctx.lineWidth = 16;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
    }
    drawGauge(null);

    function updateUI(eth, tempF, tempC) {
      currentEthanol = eth;
      lastTempF = tempF;
      lastTempC = tempC;
      ethanolPct.textContent = eth != null ? eth : '--';
      drawGauge(eth);
      const temp = freedomUnits ? tempF : tempC;
      const unit = freedomUnits ? '°F' : '°C';
      tempDisplay.textContent = temp != null ? `${temp} ${unit}` : `-- ${unit}`;
      document.getElementById('currentE').value = eth ?? 10;
      calculate();
    }

    unitToggle.addEventListener('click', () => {
      freedomUnits = !freedomUnits;
      if (lastTempF != null) {
        updateUI(currentEthanol, lastTempF, lastTempC);
      } else {
        tempDisplay.textContent = freedomUnits ? '-- °F' : '-- °C';
      }
    });

    async function connect() {
      if (!navigator.bluetooth) {
        statusEl.textContent = 'Web Bluetooth not available. On iPhone, install beacio.';
        return;
      }
      try {
        statusEl.textContent = 'Requesting device...';
        device = await navigator.bluetooth.requestDevice({
          filters: [
            { name: 'Ethanol' },
            { name: 'EthanolSensor' },
            { name: 'Ethanol Sensor' },
            { services: [SERVICE_UUID] }
          ],
          optionalServices: [SERVICE_UUID]
        });
        statusEl.textContent = 'Connecting...';
        server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        characteristic = await service.getCharacteristic(CHAR_UUID);
        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', onData);
        device.addEventListener('gattserverdisconnected', onDisconnect);
        connectBtn.disabled = true;
        connectBtn.textContent = 'Connected';
        statusEl.textContent = 'Connected';
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Failed: ' + (err.message || 'Unknown error');
      }
    }

    function onData(event) {
      const value = event.target.value;
      const text = new TextDecoder('utf-8').decode(value).trim();
      const parts = text.split(',');
      if (parts.length >= 3) {
        updateUI(parseInt(parts[0], 10), parseInt(parts[1], 10), parseInt(parts[2], 10));
      }
    }

    function onDisconnect() {
      connectBtn.disabled = false;
      connectBtn.textContent = 'Connect';
      statusEl.textContent = 'Disconnected';
      updateUI(null, null, null);
    }

    connectBtn.addEventListener('click', connect);

    function calculate() {
      let tank = parseFloat(document.getElementById('tankCap').value) || 16.9;
      const useLiters = document.getElementById('useLiters').checked;
      if (useLiters) tank = tank / 3.78541;
      const levelPct = parseFloat(document.getElementById('fuelLevel').value) || 50;
      const current = parseFloat(document.getElementById('currentE').value) || 10;
      const desired = parseFloat(document.getElementById('desiredE').value) || 40;
      const gasE = parseFloat(document.getElementById('gasE').value) || 10;
      const e85E = parseFloat(document.getElementById('e85E').value) || 85;

      let level = tank * (levelPct / 100);
      let addE85 = 0;
      let mix = current;
      const step = 0.001;
      while (tank - level > 0.001) {
        const add = mix < desired ? e85E : gasE;
        if (mix < desired) addE85 += step;
        level += step;
        mix = (level * mix + step * add) / (level + step);
      }
      let addGas = Math.max(0, tank - (tank * levelPct / 100) - addE85);
      if (useLiters) {
        addE85 *= 3.78541;
        addGas *= 3.78541;
      }
      const unit = useLiters ? 'liters' : 'gallons';
      document.getElementById('calcResult').innerHTML =
        `<strong>Add ${addE85.toFixed(1)} ${unit} of E85</strong><br>` +
        `<strong>Add ${addGas.toFixed(1)} ${unit} of gas</strong><br>` +
        `Resulting mix: ${mix.toFixed(0)}% ethanol`;
    }

    ['tankCap','fuelLevel','currentE','desiredE','gasE','e85E'].forEach(id => {
      document.getElementById(id).addEventListener('input', calculate);
    });
    document.getElementById('useLiters').addEventListener('change', calculate);
    calculate();
  </script>
</body>
</html>
